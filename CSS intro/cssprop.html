<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS property</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            height: 133px;
            width:80vw ;
            padding: 3px;
            margin: 5px;
            border: 2px solid black;
        }
        .box1{
            background-color: aliceblue;
            position: sticky;
            width: 100%;
            height: 50px;
            padding: 0;
            margin: 0;
            top: 0;
        }
            
        .box2{
            background-color: antiquewhite;
            /* position: relative; */
        }
        .box3{
            background-color: aqua;
        }
        .box4{
           background-color: blanchedalmond;
           /* position: fixed;
           top: 50px;
           left: 144px; */
        }
        .parent{
            padding: 43px;
            margin: 34px;
            border: 3px solid black;
            position: relative;
        }
    </style>
    
</head>

<body>
    <div class="parent">
        <div class="box box1"></div>    
        <div class="box box2"></div>
        <div class="box box3">
        </div>
        <div class="box box4"></div>
    </div>
</body>
</html>
